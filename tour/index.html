<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Plant 3D Photo Tour</title>
<style>
/* Layout: full-bleed 3D view; controls panel top-left, minimap top-right, step controls bottom-centre. Single dark look. */
:root{
  --bg:#0b0d10; --panel:rgba(18,22,28,.88); --line:#2c333d; --fg:#e8ecf1; --muted:#9aa4b1; --accent:#4f9cf0; --accent-ink:#06121f; --route:#5b6573;
  --ui:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:ui-monospace,Menlo,Consolas,monospace; color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font:14px/1.4 var(--ui)}
canvas#gl{display:block;touch-action:none;cursor:grab} canvas#gl:active{cursor:grabbing}
.card{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(6px);box-sizing:border-box}
#panel{top:calc(12px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));width:min(300px,calc(100vw - 24px));padding:12px;display:flex;flex-direction:column;gap:10px;max-height:calc(100% - 24px);overflow:auto}
#panel header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
h1{font-size:15px;margin:0;font-weight:600}
.sub{font:11px var(--mono);color:var(--muted)}
#panel.min .body{display:none}
.body{display:flex;flex-direction:column;gap:10px}
button{font:13px var(--ui);background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--muted)} button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button:disabled{opacity:.35;cursor:default}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.ctl{display:flex;flex-direction:column;gap:3px}
.ctl label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.ctl label span{font-family:var(--mono);color:var(--fg);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent)}
#help{font-size:12px;color:var(--muted);line-height:1.5;margin:0}
kbd{font:11px var(--mono);border:1px solid var(--line);border-radius:3px;padding:0 4px;color:var(--fg)}
#mini{top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));width:min(240px,40vw);aspect-ratio:1;padding:6px}
#mini canvas{width:100%;height:100%;display:block;cursor:pointer}
#steps{left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));padding:8px;display:flex;gap:6px;align-items:center}
#steps button{min-width:44px;height:40px;font-size:15px}
#stop{font:12px var(--mono);color:var(--muted);padding:0 6px;font-variant-numeric:tabular-nums;white-space:nowrap}
#busy{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:12px var(--mono);color:var(--muted);pointer-events:none}
@media (max-width:640px){#mini{width:34vw}#steps{bottom:calc(10px + env(safe-area-inset-bottom,0px))}}
</style></head><body>
<canvas id="gl"></canvas>
<div id="panel" class="card">
  <header><div><h1>Plant 3D Photo Tour</h1><div class="sub">full-resolution RGB-D · 23 Jul 2026</div></div><button id="min" aria-label="Collapse panel">–</button></header>
  <div class="body">
    <div class="seg"><button id="ctx" class="on">Full map in background</button></div>
    <div class="ctl"><label for="nb">Neighbouring frames shown <span id="nbl"></span></label><input id="nb" type="range" min="0" max="6" step="1" value="2"></div>
    <div class="ctl"><label for="ps">Point size <span id="psl"></span></label><input id="ps" type="range" min="0.6" max="3" step="0.1" value="1.4"></div>
    <div class="ctl"><label for="fov">Field of view <span id="fovl"></span></label><input id="fov" type="range" min="35" max="100" step="1" value="60"></div>
    <div class="ctl"><label for="spd">Tour speed <span id="spdl"></span></label><input id="spd" type="range" min="0.5" max="4" step="0.25" value="1.5"></div>
    <p id="help">Drag to look around, scroll to change field of view.<br><kbd>↑</kbd> <kbd>↓</kbd> step forward / back in the direction you look · <kbd>←</kbd> <kbd>→</kbd> turn · <kbd>N</kbd> <kbd>P</kbd> next / previous stop on the route · <kbd>Space</kbd> play / pause · <kbd>H</kbd> hide panels. Click the minimap to jump.</p>
  </div>
</div>
<div id="mini" class="card"><canvas id="map"></canvas></div>
<div id="steps" class="card">
  <button id="prev" aria-label="Previous stop">⏮</button><button id="back" aria-label="Step back">▼</button>
  <button id="play" aria-label="Play tour">▶</button>
  <button id="fwd" aria-label="Step forward">▲</button><button id="next" aria-label="Next stop">⏭</button>
  <span id="stop"></span>
</div>
<div id="busy"></div>
<script type="importmap">{"imports":{"three":"../lib/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const $=id=>document.getElementById(id);
const M=await (await fetch('tour.json')).json(); const VP=M.viewpoints; const N=VP.length;

// ---------- renderer / camera ----------
const r=new THREE.WebGLRenderer({canvas:$('gl'),antialias:false}); r.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x0b0d10);
const cam=new THREE.PerspectiveCamera(60,1,0.05,300); cam.up.set(0,0,1);
function resize(){r.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();drawMap();}

// Points whose on-screen size matches one depth-camera pixel footprint, so the photo looks solid from its own viewpoint.
const frameMat=new THREE.ShaderMaterial({
  uniforms:{scale:{value:1},mul:{value:1.4},opacity:{value:1}},
  vertexShader:`attribute vec3 rgb; attribute float fp; uniform float scale; uniform float mul; varying vec3 vC;
    void main(){ vec4 mv=modelViewMatrix*vec4(position,1.0); gl_Position=projectionMatrix*mv;
      gl_PointSize=clamp(fp*mul*scale/max(-mv.z,0.05),1.0,28.0); vC=rgb; }`,
  fragmentShader:`varying vec3 vC; uniform float opacity; void main(){ gl_FragColor=vec4(vC,opacity); }`
});
function updScale(){const h=r.domElement.height; frameMat.uniforms.scale.value=h/(2*Math.tan(THREE.MathUtils.degToRad(cam.fov)/2));}

// ---------- frame loading (RGB jpg + uint16 depth -> points in camera optical frame) ----------
const cache=new Map(), pending=new Map();
const OPT2CAM=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0),Math.PI); // optical (z fwd, y down) -> three camera (-z fwd, y up)
async function loadFrame(i){
  if(cache.has(i)) return cache.get(i); if(pending.has(i)) return pending.get(i);
  const v=VP[i];
  const job=(async()=>{
    const [img,dbuf]=await Promise.all([
      fetch(`frames/${v.id}.jpg`).then(r=>r.blob()).then(b=>createImageBitmap(b)),
      fetch(`frames/${v.id}.bin`).then(r=>r.arrayBuffer())]);
    const c=new OffscreenCanvas(M.w,M.h).getContext('2d'); c.drawImage(img,0,0); const px=c.getImageData(0,0,M.w,M.h).data;
    const d=new Uint16Array(dbuf); let n=0; for(let k=0;k<d.length;k++) if(d[k]) n++;
    const pos=new Float32Array(n*3), col=new Uint8Array(n*3), fp=new Float32Array(n); let j=0;
    for(let y=0;y<M.h;y++) for(let x=0;x<M.w;x++){ const k=y*M.w+x, z=d[k]*M.depthScale; if(!z) continue;
      pos[j*3]=(x-M.cx)*z/M.fx; pos[j*3+1]=(y-M.cy)*z/M.fy; pos[j*3+2]=z; fp[j]=z/M.fx;
      col[j*3]=px[k*4]; col[j*3+1]=px[k*4+1]; col[j*3+2]=px[k*4+2]; j++; }
    const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(pos,3));
    g.setAttribute('rgb',new THREE.BufferAttribute(col,3,true)); g.setAttribute('fp',new THREE.BufferAttribute(fp,1));
    const p=new THREE.Points(g,frameMat); p.frustumCulled=false;
    p.position.fromArray(v.p); p.quaternion.set(...v.q); p.visible=false; scene.add(p);
    cache.set(i,p); pending.delete(i); return p;})();
  pending.set(i,job); return job;
}
function trimCache(keep){ if(cache.size<=24) return; for(const [i,p] of cache){ if(!keep.has(i)){ scene.remove(p); p.geometry.dispose(); cache.delete(i); if(cache.size<=18) break; } } }
async function showAround(i){
  const k=+$('nb').value, want=new Set([i]); for(let s=1;want.size<k+1&&s<N;s++){ if(i-s>=0) want.add(i-s); if(want.size<k+1&&i+s<N) want.add(i+s); }
  await Promise.all([...want].map(loadFrame));
  for(const [j,p] of cache) p.visible=want.has(j);
  trimCache(want);
  for(const j of [i+1,i+2,i-1]) if(j>=0&&j<N) loadFrame(j); // prefetch
}

// ---------- global map (context) ----------
let ctx=null;
(async()=>{ try{ const meta=await (await fetch('../data/meta.json')).json(); const c=meta.cloud[0]; const buf=await (await fetch('../'+c.file)).arrayBuffer();
  const q=new Uint16Array(buf,0,c.n*3), p=new Float32Array(c.n*3); for(let k=0;k<c.n*3;k++) p[k]=meta.lo[k%3]+q[k]*meta.sc[k%3];
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(p,3)); g.setAttribute('color',new THREE.BufferAttribute(new Uint8Array(buf,c.n*6,c.n*3),3,true));
  ctx=new THREE.Points(g,new THREE.PointsMaterial({size:1.5,sizeAttenuation:false,vertexColors:true,transparent:true,opacity:.45,depthWrite:false}));
  ctx.renderOrder=-1; ctx.visible=$('ctx').classList.contains('on'); scene.add(ctx);}catch(e){ $('ctx').disabled=true; } })();

// ---------- view state: position + yaw/pitch (world z up) ----------
let cur=0, yaw=0, pitch=0, anim=null, playing=false;
const tmpV=new THREE.Vector3();
function vpLook(i){ const q=new THREE.Quaternion(...VP[i].q); const f=new THREE.Vector3(0,0,1).applyQuaternion(q); return {yaw:Math.atan2(f.y,f.x),pitch:Math.asin(Math.max(-1,Math.min(1,f.z)))}; }
function applyCam(){ cam.lookAt(tmpV.copy(cam.position).add(new THREE.Vector3(Math.cos(pitch)*Math.cos(yaw),Math.cos(pitch)*Math.sin(yaw),Math.sin(pitch)))); }
const wrap=a=>Math.atan2(Math.sin(a),Math.cos(a));
async function goTo(i,{keepLook=false}={}){
  if(i<0||i>=N||anim) return; $('busy').textContent=cache.has(i)?'':'loading frame…';
  await showAround(i); $('busy').textContent='';
  const from={p:cam.position.clone(),yaw,pitch}, L=keepLook?{yaw,pitch}:vpLook(i), to={p:new THREE.Vector3(...VP[i].p),...L};
  const dist=from.p.distanceTo(to.p), dur=Math.min(1600,Math.max(350,dist/+$('spd').value*1000));
  cur=i; updateUI();
  await new Promise(res=>{ const t0=performance.now(); anim=t=>{ let a=Math.min(1,(t-t0)/dur); const e=a<.5?2*a*a:1-Math.pow(-2*a+2,2)/2;
    cam.position.lerpVectors(from.p,to.p,e); yaw=from.yaw+wrap(to.yaw-from.yaw)*e; pitch=from.pitch+(to.pitch-from.pitch)*e;
    if(a>=1){anim=null;res();} }; });
}
function stepDir(sign){ // nearest stop roughly in the look direction (or opposite), within 3 m
  const P=new THREE.Vector3(...VP[cur].p), dir=yaw+(sign<0?Math.PI:0); let best=-1,bs=1e9;
  VP.forEach((v,i)=>{ if(i===cur) return; const dx=v.p[0]-P.x, dy=v.p[1]-P.y, d=Math.hypot(dx,dy); if(d>3) return;
    const ang=Math.abs(wrap(Math.atan2(dy,dx)-dir)); if(ang>Math.PI/4) return; const s=d*(1+2*ang); if(s<bs){bs=s;best=i;} });
  if(best>=0) goTo(best,{keepLook:true});
}
function turn(deg){ if(anim) return; const y0=yaw, t0=performance.now(); anim=t=>{ const a=Math.min(1,(t-t0)/300); yaw=y0+THREE.MathUtils.degToRad(deg)*a*(2-a); if(a>=1) anim=null; }; }

// ---------- tour playback ----------
async function play(){ playing=!playing; $('play').textContent=playing?'⏸':'▶'; $('play').setAttribute('aria-label',playing?'Pause tour':'Play tour');
  while(playing){ if(cur>=N-1){ playing=false; break; } await goTo(cur+1); await new Promise(r=>setTimeout(r,250)); }
  $('play').textContent='▶'; $('play').setAttribute('aria-label','Play tour'); }

// ---------- minimap ----------
const mc=$('map'), mx=mc.getContext('2d'); const xs=M.route.map(p=>p[0]), ys=M.route.map(p=>p[1]);
const bx=[Math.min(...xs),Math.max(...xs)], by=[Math.min(...ys),Math.max(...ys)];
function toMap(x,y){ const W=mc.width,H=mc.height,pad=14*devicePixelRatio, s=Math.min((W-2*pad)/(bx[1]-bx[0]||1),(H-2*pad)/(by[1]-by[0]||1));
  const ox=(W-s*(bx[1]-bx[0]))/2, oy=(H-s*(by[1]-by[0]))/2; return [ox+(x-bx[0])*s, H-(oy+(y-by[0])*s)]; }
function drawMap(){ const R=mc.getBoundingClientRect(); mc.width=R.width*devicePixelRatio; mc.height=R.height*devicePixelRatio; const dp=devicePixelRatio;
  mx.clearRect(0,0,mc.width,mc.height); mx.strokeStyle='#5b6573'; mx.lineWidth=2*dp; mx.beginPath(); M.route.forEach((p,i)=>{const [a,b]=toMap(...p); i?mx.lineTo(a,b):mx.moveTo(a,b);}); mx.stroke();
  VP.forEach((v,i)=>{const [a,b]=toMap(v.p[0],v.p[1]); mx.fillStyle=i===cur?'#4f9cf0':'#c9d1db'; mx.beginPath(); mx.arc(a,b,(i===cur?5:2.2)*dp,0,7); mx.fill();});
  const [a,b]=toMap(cam.position.x,cam.position.y); mx.strokeStyle='#4f9cf0'; mx.lineWidth=2.5*dp; mx.beginPath(); mx.moveTo(a,b); mx.lineTo(a+Math.cos(yaw)*16*dp,b-Math.sin(yaw)*16*dp); mx.stroke(); }
mc.addEventListener('click',e=>{ const R=mc.getBoundingClientRect(), px=(e.clientX-R.left)*devicePixelRatio, py=(e.clientY-R.top)*devicePixelRatio; let best=0,bd=1e9;
  VP.forEach((v,i)=>{const [a,b]=toMap(v.p[0],v.p[1]); const d=Math.hypot(a-px,b-py); if(d<bd){bd=d;best=i;}}); goTo(best); });

// ---------- UI ----------
function updateUI(){ $('stop').textContent=`stop ${cur+1} / ${N} · node ${VP[cur].id}`; $('prev').disabled=cur===0; $('next').disabled=cur===N-1;
  $('nbl').textContent=$('nb').value; $('psl').textContent=(+$('ps').value).toFixed(1)+'×'; $('fovl').textContent=$('fov').value+'°'; $('spdl').textContent=$('spd').value+' m/s'; }
$('prev').onclick=()=>goTo(cur-1); $('next').onclick=()=>goTo(cur+1); $('fwd').onclick=()=>stepDir(1); $('back').onclick=()=>stepDir(-1); $('play').onclick=play;
$('nb').oninput=()=>{updateUI(); showAround(cur);}; $('ps').oninput=()=>{frameMat.uniforms.mul.value=+$('ps').value;updateUI();};
$('fov').oninput=()=>{cam.fov=+$('fov').value;cam.updateProjectionMatrix();updScale();updateUI();}; $('spd').oninput=updateUI;
$('ctx').onclick=()=>{const on=$('ctx').classList.toggle('on'); if(ctx) ctx.visible=on;};
$('min').onclick=()=>{const m=$('panel').classList.toggle('min');$('min').textContent=m?'+':'–';};
addEventListener('keydown',e=>{ if(e.target.tagName==='INPUT') return; const k=e.key;
  if(k==='ArrowUp'){e.preventDefault();stepDir(1);} else if(k==='ArrowDown'){e.preventDefault();stepDir(-1);}
  else if(k==='ArrowLeft'){e.preventDefault();turn(45);} else if(k==='ArrowRight'){e.preventDefault();turn(-45);}
  else if(k==='n'||k==='N') goTo(cur+1); else if(k==='p'||k==='P') goTo(cur-1);
  else if(k===' '){e.preventDefault();play();} else if(k==='h'||k==='H'){ for(const id of ['panel','mini','steps']) $(id).hidden=!$(id).hidden; } });
let drag=null; const gl=$('gl');
gl.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};gl.setPointerCapture(e.pointerId);});
gl.addEventListener('pointermove',e=>{ if(!drag) return; const k=THREE.MathUtils.degToRad(cam.fov)/innerHeight; yaw+=(e.clientX-drag.x)*k; pitch=Math.max(-1.45,Math.min(1.45,pitch+(e.clientY-drag.y)*k)); drag={x:e.clientX,y:e.clientY}; });
gl.addEventListener('pointerup',()=>drag=null); gl.addEventListener('pointercancel',()=>drag=null);
gl.addEventListener('wheel',e=>{e.preventDefault(); $('fov').value=Math.max(35,Math.min(100,cam.fov+Math.sign(e.deltaY)*3)); $('fov').oninput();},{passive:false});
addEventListener('resize',()=>{resize();updScale();});

// ---------- start ----------
resize(); updScale(); updateUI();
cam.position.fromArray(VP[0].p); ({yaw,pitch}=vpLook(0));
$('busy').textContent='loading frame…'; await showAround(0); $('busy').textContent='';
let lastMap=0;
r.setAnimationLoop(t=>{ if(anim) anim(t); applyCam(); r.render(scene,cam); if(t-lastMap>100){drawMap();lastMap=t;} });
</script>
</body></html>
